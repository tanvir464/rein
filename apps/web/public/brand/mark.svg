<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-label="REIN">
  <!-- Asymmetric loop with single crossover. Strand A (under) drawn first with a 4px gap centered at (12,12); strand B (over) drawn last, occluding the gap. Single shape reads as a bounded leash / closed policy. -->
  <path d="M16 4 C20 6, 21 10, 14 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 12 C3 14, 4 18, 8 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 4 L8 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 20 L8 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M8 4 C4 6, 3 10, 12 12 C21 14, 20 18, 16 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
