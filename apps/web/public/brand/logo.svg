<svg xmlns="http://www.w3.org/2000/svg" width="200" height="32" viewBox="0 0 200 32" fill="none" aria-label="REIN">
  <!-- Mark (24×24) sits on the left at cap height, accent-700 -->
  <g transform="translate(0, 4)" stroke="hsl(173, 80%, 36%)">
    <path d="M16 4 C20 6, 21 10, 14 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 12 C3 14, 4 18, 8 20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 4 L8 4" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 20 L8 20" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 4 C4 6, 3 10, 12 12 C21 14, 20 18, 16 20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark, 12px gap from mark -->
  <text x="36" y="24" fill="currentColor"
        font-family="Geist, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="600"
        font-size="28"
        letter-spacing="-0.56">REIN</text>
</svg>
