app = "rein-sidecar"
primary_region = "ord"

[build]

[env]
PORT = "8788"

[http_service]
internal_port = 8788
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "20s"
method = "GET"
path = "/health"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
