[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rein"
version = "0.1.0"
description = "REIN — Python SDK. Trust-gated wallet for AI agents on Solana."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "REIN" }]
keywords = ["solana", "agent", "x402", "wallet", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "base58>=2.1.1",
]

[project.optional-dependencies]
chain = ["solders>=0.20.0"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rein*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
